<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thorfinn's Philosophy Path</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='mascot.css') }}">
</head>

<body>
  <header>
    <h1>Thorfinn's Philosophy Path</h1>
    <p>Greek thinkers, modern philosophers and anime characters, seen through a calmer mind.</p>
  </header>

  <section class="filters">
    <select id="worldFilter">
      <option value="">All worlds</option>
      <option value="Anime">Anime</option>
      <option value="Greek">Greek</option>
      <option value="Modern">Modern</option>
    </select>

    <select id="schoolFilter">
      <option value="">All schools</option>
    </select>

    <input type="text" id="tagFilter" placeholder="Search by tag (e.g. freedom)">
    <button id="resetBtn">Reset</button>
  </section>

  <p id="resultCount"></p>
  <main id="cardGrid"></main>

  <!-- Detail popup -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <button id="closeModal" class="close">&times;</button>
      <h2 id="modalName"></h2>
      <p id="modalMeta" class="meta"></p>

      <h3>Core idea</h3>
      <p id="modalIdea"></p>

      <h3>Life lesson</h3>
      <p id="modalLesson"></p>

      <h3>Thorfinn says</h3>
      <blockquote id="modalComment"></blockquote>

      <div id="modalTags" class="tags"></div>
    </div>
  </div>

  <div id="mascot" data-store="local" data-key="home"
       data-lines='{{ [
         "I am Thorfinn. I once lived only for revenge, and it left me empty.",
         "This place is a path through the ideas of people who asked what a good life is.",
         "You will find Greek thinkers, modern philosophers, and characters from stories I know.",
         "Filter by world, school or tag, then open any card. I will tell you what I think of them.",
         "Click me any time to hear this again."
       ]|tojson }}'>
    <div id="mascot-bubble" class="hidden">
      <span id="mascot-name">Thorfinn</span>
      <p id="mascot-text"></p>
      <div class="mascot-actions">
        <button id="mascot-skip" type="button">Skip</button>
        <button id="mascot-next" type="button">Next</button>
      </div>
    </div>
    <img id="mascot-avatar"
         src="{{ url_for('static', filename='img/thorfinn.png') }}"
         data-fallback="{{ url_for('static', filename='img/thorfinn.svg') }}"
         onerror="this.onerror=null; this.src=this.dataset.fallback;"
         alt="Thorfinn, click to hear him again">
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
  <script src="{{ url_for('static', filename='mascot.js') }}" defer></script>
</body>
</html>
